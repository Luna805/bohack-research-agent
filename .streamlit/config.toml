# Light workbench theme (design spec v0.1): neutral ground, one blue accent.
[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F5F6F8"
secondaryBackgroundColor = "#F2F4F7"
textColor = "#101828"
borderColor = "#E4E7EC"
linkColor = "#1D4ED8"
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
chartCategoricalColors = ["#2563EB", "#12B76A", "#F79009", "#98A2B3"]
# Compact type scale (reference workbench): 14px body, 12-13px tables and captions.
baseFontSize = 14
metricValueFontSize = "1.1rem"
metricValueFontWeight = 600
headingFontSizes = ["1.6rem", "1.45rem", "1.15rem", "1rem", "0.9rem", "0.85rem"]
codeFontSize = "0.85rem"
dataframeHeaderBackgroundColor = "#F9FAFB"
