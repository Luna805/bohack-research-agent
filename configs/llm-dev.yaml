# A's live-LLM development config for the Bank Marketing task.
# Authorises real spending: budget.max_llm_tokens / max_llm_requests are positive.
# Model, base URL and key come from LLM_MODEL / LLM_BASE_URL / LLM_API_KEY in .env, not here.
task_id: bank_marketing
proposer: llm
cv_folds: 5
split_seed: 42
calibration_split_seeds: [11, 23, 37, 53, 71]
confirmation_split_seeds: [137, 2026, 31415]
training_seed: 42
search_seed: 2026
min_effect_floor: 0.002
budget:
  max_llm_tokens: 200000   # positive: authorises live LLM spending
  max_llm_requests: 60
  max_cost_usd: null
  max_experiments: 40
  max_fits: 200
  max_tool_search_fits: 30
  max_total_seconds: 1800
  experiment_timeout_seconds: 120
  max_empty_proposal_rounds: 2
loop:
  max_rounds: 8
  initial_tool_search: 2
  tool_search_batch: 2
  stagnation_tool_search: 2
  stagnation_replan: 2
  stagnation_stop: 4
  cheap_experiment_seconds: 30
llm:
  model: null                # or LLM_MODEL in .env
  base_url: null             # or LLM_BASE_URL in .env; key only via LLM_API_KEY in .env
  output_mode: tool          # tool | native | prompted
  max_output_tokens: 3000
  output_retries: 1
  timeout_seconds: 120
  extra_body:                # qwen3.7-plus is a reasoning model; turn thinking off to save tokens
    enable_thinking: false
  input_price_per_mtok: null
  output_price_per_mtok: null
