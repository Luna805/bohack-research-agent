# FALLBACK official matrix (role C): use only if no LLM is available at the 19:30 freeze.
# Results must then be described as "scripted proposals", never as LLM research.
# Run only after the freeze, on one idle machine, from a clean checkout of the tag:
#   git checkout benchmark-freeze
#   python -m budgetlab.benchmark --matrix configs/benchmark/final-scripted.yaml --dry-run
#   caffeinate -i python -m budgetlab.benchmark --matrix configs/benchmark/final-scripted.yaml
# Size estimate (idle M-series Mac): ~11.5 min per repeat for both tasks -> ~35 min for 3 repeats.
kind: final
description: Bank Marketing and Adult, three systems, scripted proposals (no LLM available), three repeats
tasks:
  - name: bank_marketing
    config: configs/bank_marketing.yaml
  - name: adult
    config: configs/adult.yaml
systems: [random_search, budgetlab_no_schedule, budgetlab]
repeats: 3
proposer: scripted
repeat_seed_stride: 1000
overrides: {}
