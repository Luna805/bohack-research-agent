[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "budgetlab"
version = "0.1.0"
description = "Deterministic, auditable research controller for constrained ML experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "joblib==1.4.2",
  "numpy==1.26.4",
  "pandas==2.2.2",
  "pydantic>=2.12,<3",
  "PyYAML>=6.0.2,<7",
  "scikit-learn==1.5.1",
]

[project.optional-dependencies]
dev = ["pytest==7.4.4", "ruff>=0.8,<1"]
llm = ["pydantic-ai-slim[openai]==2.68.0"]
ui = ["streamlit>=1.40", "plotly>=5.24"]

[project.scripts]
budgetlab = "budgetlab.cli:main"

[tool.setuptools.packages.find]
include = ["budgetlab*"]

[tool.setuptools.package-data]
budgetlab = ["tasks/cards/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live_api: requires explicit API budget and credentials",
  "kaggle: requires Kaggle access and accepted competition rules",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
